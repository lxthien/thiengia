framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # Dùng chung DB hiện có (bảng messenger_messages) — không cần thêm
            # hạ tầng (Redis/RabbitMQ) cho quy mô project này. Cần worker chạy
            # định kỳ để xử lý hàng đợi, xem app:sync-views/app:publish-scheduled
            # cho quy ước cron sẵn có — thêm dòng cron tương tự:
            #   * * * * * cd /path/to/project && php bin/console messenger:consume async --time-limit=55 --memory-limit=64M >> var/log/messenger.log 2>&1
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Email được gửi ngay trong request (transport "sync"), không qua hàng
            # đợi: lượng form của site thấp, và cách này không cần worker/cron
            # messenger:consume — thứ từng dồn tiến trình làm cạn kết nối DB trên
            # production. Muốn quay lại hàng đợi thì đổi "sync" thành "async" và
            # chạy worker có flock + timeout.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: sync

